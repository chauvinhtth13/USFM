[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["usdsgen*"]

[project]
name = "usdsgen"
version = "0.2.0"
description = "USDSGen (de-mm, Python 3.14)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13",
    "torchvision>=0.28",
    "lightning>=2.6",
    "timm>=1.0",
    "albumentations>=2.0",
    "torchmetrics>=1.9",
    "monai>=1.6",
    "numpy>=2.4",
    "scipy",
    "pandas",
    "Pillow",
    "scikit-learn",       # cls_trainer: confusion_matrix / balanced_accuracy_score
    "hydra-core>=1.3",
    "hydra-colorlog",
    "omegaconf>=2.3",
    "tensorboard",
    "termcolor",           # utils/logger.py: mau cho log console
    "opencv-python-headless",
]

# Khong khai [project.scripts]: entrypoint la ./main.py o repo root
# (chay `python main.py ...`), khong phai module trong package.

[tool.ruff]
line-length = 90
target-version = "py312"
exclude = ["logs", "datasets", "assets"]

[tool.ruff.lint]
# Chi bat loi that su (pyflakes + loi cu phap/logic) va sap xep import.
# Khong bat cac nhom style: code ke thua tu upstream con nhieu nit vo hai,
# bat het se chan commit ma khong doi lai duoc gi.
select = ["E4", "E7", "E9", "F", "I"]
# E501 (do dai dong) do formatter lo; E741 vi code goc dung ten bien 1 ky tu.
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# main.py PHAI va argparse truoc khi import hydra -> import khong the len dau file
"main.py" = ["E402"]
