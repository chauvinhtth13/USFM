[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {}

[project]
name = "usdsgen"
version = "0.2.0"
description = "USDSGen (de-mm, Python 3.14)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13",
    "torchvision>=0.28",
    "lightning>=2.6",
    "timm>=1.0",
    "albumentations>=2.0",
    "torchmetrics>=1.9",
    "monai>=1.6",
    "numpy>=2.4",
    "scipy",
    "pandas",
    "Pillow",
    "hydra-core>=1.3",
    "hydra-colorlog",
    "omegaconf>=2.3",
    "tensorboard",
    "opencv-python-headless",
]

[project.scripts]
usdsgen = "usdsgen.main:main"