name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Import smoke test
        run: |
          python -c "
          from usdsgen.models.build import build_seg_model
          from usdsgen.trainer import ClsTrainer, SegTrainer
          m = build_seg_model({
              'backbone': {'type': 'HVITBackbone4Seg', 'img_size': 64, 'patch_size': 16,
                           'embed_dim': 64, 'depth': 2, 'num_heads': 2,
                           'out_indices': [0, 1], 'use_abs_pos_emb': False,
                           'use_rel_pos_bias': True, 'qkv_bias': True, 'init_values': 0.1},
              'decode_head': {'type': 'ATMHead', 'img_size': 64, 'in_channels': 64,
                              'channels': 64, 'num_classes': 2, 'num_layers': 1,
                              'num_heads': 2, 'use_stages': 2, 'embed_dims': 64,
                              'loss_decode': {'type': 'ATMLoss', 'num_classes': 2,
                                              'dec_layers': 1, 'loss_weight': 1.0}},
          }, logger=None)
          import torch
          out = m(torch.randn(1, 3, 64, 64))
          assert out['pred'].shape == (1, 2, 64, 64), out['pred'].shape
          print('ok', out['pred'].shape)
          "

      - name: Dataset self-check
        run: python test_dataset.py
